gardens:
  - name: Fearon Hall
    description: Fearon Hall is our home, where we have our beautiful greenhouse and
      sheds; where we have our parties, workshops, gatherings.  We grow food on
      two beds on Rectory Road.  One is fronted by a lovely raised bed made by
      Glebe House Work Skills and paid for by Chesterton House Financial
      Planning.  We put it there to deter people from driving onto the garden
      and squashing the plants!
    image: images/gardens/fearonhallbed.jpg
    google_map_url: https://maps.app.goo.gl/rEYqJimwmPqX5sCU9
    lat: 52.775517
    lng: -1.20373
    map_title: Fearon Hall
  - name: Cambridge Street Corner Garden
    description: "**The Corner Garden** at the bottom of Cambridge Street is where
      we started.  There are 11 raised beds, the wooden ones were made from
      re-purposed wood by Glebe House Work Skills and paid for by Chesterton
      House Financial Planning.  There are fruit bushes in the garden and at
      most times of the year there will be vegetables to pick.  What a great
      community to be part of. Many people go there to enjoy the peace and to
      pick food and they all tell us they love what we have done.  When we
      started there the soil was dead, not a worm in sight.  Last year our
      nasturtiums were covered in caterpillars.  Yippee, more butterflies!"
    image: /images/gardens/corner.jpg
    google_map_url: https://maps.app.goo.gl/hBKbPKbTcYzBUDac6
    lat: 52.776984
    lng: -1.206465
    map_title: Corner Garden, Cambridge Street
  - name: King George Road Allotment
    description: The **IEL Allotment** is off King George Road near Paget Pastures.
      This is a space for the more confident food growers among us to practice
      their skills. Most of the food produced goes to food banks, and there is
      plenty of it. It’s a lovely place for our summer parties as well.
    image: images/gardens/allotment.jpg
    google_map_url: https://maps.app.goo.gl/Eqsr2Ufa5Bp8ZLQi8
    lat: 52
    lng: -1
    map_title: King George Rd Allotment
  - name: Knightthorpe Methodist Church
    description: The IEL garden in front of Knightthorpe Methodist Church has to be
      seen, a lovely spot but also amazingly productive of healthy organic food,
      free to anyone who cares to wander in off the street. Opposite the IEL
      beds is a memorial garden, which is a haven of peace. Volunteers here will
      also be expected to work with the team on the church gardens so there is
      plenty of opportunity here to develop skills in conventional gardening as
      well as food growing. This lovely garden won a special Judges' Award in
      the 2026 East Midlands in Bloom competition.
    image: images/gardens/kmc.jpg
    google_map_url: https://maps.app.goo.gl/tuvofNNyucRXtCaFA
    lat: 52.777257
    lng: -1.22715
    map_title: Knightthorpe Methodist Church
  - name: Orwell Close Warwick Way Flats
    description: At the **Warwick Way Flats, Orwell Close,** we have several raised
      beds in front of the Association café and at the end of the Orwell Close
      car park.  Strawberries, beans, beetroot, peas, courgettes are all likely
      to be growing there in the summer months.
    image: images/gardens/warwayflats.jpg
    google_map_url: https://maps.app.goo.gl/TvaPDbimR4KWaiS98
    lat: 52.780561
    lng: -1.22954
    map_title: Warwick Way Flats
  - name: Thorpe Acre Road
    description: Our small garden in **Thorpe Acre Road** is well known by the
      locals, who often stop and talk when we are gardening there.  And across
      the road from it there is another private front garden turned into a
      public source of organic produce.
    image: images/gardens/tar.jpg
    google_map_url: https://maps.app.goo.gl/XxHkGdCPUKadefuY8
    lat: 52.776742
    lng: -1.235281
    map_title: Thorpe Acre Road
  - name: Great Central Road Allotment
    description: This **IEL Great Central Allotment** is found on Great Central Road
      near the Great Central Railway Station. This is a space for the more
      confident food growers among us to practice their skills. We moved onto
      our growing space in September 2026. Getting the land renewed with compost
      and established for the next growing season. It's a wonderful space to
      meet the surrounding allotment growers who have produce to boast of and
      gardening experiences to share.
    image: images/gardens/railway-allotment.jpg
    google_map_url: https://maps.app.goo.gl/mmMv9Edrpn9YPSJs7
    lat: 52
    lng: -1
    map_title: Allotments
